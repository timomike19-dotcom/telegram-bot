name: Scheduled vacancy publication

on:
  schedule:
    - cron: "7 10 * * *"
      timezone: "Europe/Moscow"
    - cron: "7 14 * * *"
      timezone: "Europe/Moscow"
    - cron: "7 18 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-vacancy-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BOT_DATA_DIR: data
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HH_APP_TOKEN: ${{ secrets.HH_APP_TOKEN }}
      HH_USER_AGENT: ${{ secrets.HH_USER_AGENT }}
    steps:
      - name: Check out private project
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore posting history
        uses: actions/cache@v4
        with:
          path: data/vacancies.sqlite3
          key: vacancy-history-${{ github.run_id }}
          restore-keys: |
            vacancy-history-
      - name: Run this scheduled slot once
        run: python telegram_bot.py --scheduled-once
		
